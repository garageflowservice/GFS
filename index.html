<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }
        body::before {
            background: #0071e3;
            top: 15%;
            left: 20%;
        }
        body::after {
            background: #bf5af2;
            bottom: 15%;
            right: 20%;
        }

        .glass-panel {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="email"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        /* Nyilak elrejtése a számmezőben */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        select option {
            background: #1e1b4b;
            color: #fff;
        }

        .date-row {
            display: flex;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .primary-btn {
            background: #0071e3;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.3);
        }

        .primary-btn:hover {
            background: #147ce5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: auto;
            white-space: nowrap;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .retrieve-btn {
            background: linear-gradient(135deg, #bf5af2 0%, #ac46db 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(191, 90, 242, 0.3);
            margin-top: 5px;
        }

        .retrieve-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(191, 90, 242, 0.4);
        }

        hhr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 30px 0;
        }

        /* SIKERES KÉPERNYŐ */
        #successScreen {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            color: #34c759;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(52, 199, 89, 0.4);
        }

        .success-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .success-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- FŐOLDAL -->
    <div class="glass-panel" id="mainDashboard">
        <h1>GarageFlow</h1>
        <div class="subtitle">Smart Service Tracker</div>
        
        <!-- BRAND SELECTION -->
        <div class="form-group">
            <label for="brandSelect">Vehicle Brand</label>
            <select id="brandSelect">
                <option value="Audi">Audi</option>
                <option value="Ford">Ford</option>
                <option value="Volkswagen">Volkswagen</option>
            </select>
        </div>

        <hhr>

        <!-- SUBMIT SECTION -->
        <div class="section-title">✦ Record New Service</div>
        
        <div class="form-group">
            <label for="serviceDate">Service Date</label>
            <div class="date-row">
                <input type="date" id="serviceDate">
                <button type="button" class="secondary-btn" onclick="setToday()">Today</button>
            </div>
        </div>

        <!-- ÚJ MEZŐ: KM ÁLLÁS -->
        <div class="form-group">
            <label for="mileage">Mileage (km)</label>
            <input type="number" id="mileage" placeholder="E.g. 150000">
        </div>
        
        <div class="form-group">
            <label for="details">Performed Work / Details</label>
            <input type="text" id="details" placeholder="E.g. Oil change, brake pads">
        </div>
        
        <button class="primary-btn" onclick="submitData()">Save Data</button>

        <hhr>

        <!-- RETRIEVE SECTION -->
        <div class="section-title">✦ Request Digital Service Log</div>
        
        <div class="form-group">
            <label for="userEmail">Target E-mail Address</label>
            <input type="email" id="userEmail" placeholder="example@email.com">
        </div>
        
        <button class="retrieve-btn" onclick="retrieveData()">Send Data via E-mail</button>
    </div>

    <!-- SIKERES KÉPERNYŐ -->
    <div class="glass-panel" id="successScreen">
        <div class="success-icon">✓</div>
        <div class="success-title">Registration Successful!</div>
        <div class="success-text">The service information has been securely saved to the database.</div>
        
        <button class="secondary-btn" style="width: 100%; padding: 14px;" onclick="showDashboard()">Back to Dashboard</button>
    </div>

    <script>
        // FONTOS: IDE ILLESZD BE AZ APPS SCRIPT URL-T (AZ ÚJ TELEPÍTÉS UTÁN)
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbxq14m_BR816KFV1ijm9IupT4gZjr7cE49YcNEljw9SUlzA6ElxV1uu8de5tvV-K8BEIA/exec';

        function getSelectedBrand() {
            return document.getElementById('brandSelect').value;
        }

        function setToday() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('serviceDate').value = `${yyyy}-${mm}-${dd}`;
        }

        function showSuccessScreen() {
            document.getElementById('mainDashboard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        }

        function showDashboard() {
            document.getElementById('successScreen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
        }

        function submitData() {
            let brand = getSelectedBrand();
            let serviceDate = document.getElementById('serviceDate').value;
            let mileage = document.getElementById('mileage').value; // KM beolvasása
            let details = document.getElementById('details').value;

            if(!serviceDate || !mileage || !details) {
                alert("Please fill in the date, mileage, and service details!");
                return;
            }

            let btn = event.target;
            let originalText = btn.innerText;
            btn.innerText = "Connecting to database...";
            btn.disabled = true;

            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=submit&brand=${brand}&serviceDate=${serviceDate}&mileage=${mileage}&details=${details}`
            })
            .then(response => response.text())
            .then(data => {
                showSuccessScreen();
                
                document.getElementById('serviceDate').value = '';
                document.getElementById('mileage').value = '';
                document.getElementById('details').value = '';
                btn.innerText = originalText;
                btn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert("An error occurred while saving the data.");
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function retrieveData() {
            let brand = getSelectedBrand();
            let email = document.getElementById('userEmail').value;

            if(!email) {
                alert("Please provide a valid e-mail address!");
                return;
            }

            let btn = event.target;
            let originalText = btn.innerText;
            btn.innerText = `Compiling summary (${brand})...`;
            btn.disabled = true;

            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=retrieve&brand=${brand}&email=${email}`
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                btn.innerText = originalText;
                btn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert("An error occurred during retrieval.");
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
